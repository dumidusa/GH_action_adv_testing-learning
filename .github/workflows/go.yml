name: Simple go build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run main.go
        run: go run main.go
      - name: Run broken.go
        run: go run broken.go